name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python tests/static_storage_check.py
      - run: python tests/test_web_storage_contract.py
      - run: python tests/test_variant_contract.py
      - run: python tests/test_backup_contract.py
      - run: python tests/test_backup_restore.py
      - run: python tests/test_ci_workflow.py
      - run: python tests/test_extension_runtime_contract.py
      - run: python tests/simulate_time_scheduler.py
      - run: node tests/check_web_js.js

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    strategy:
      fail-fast: false
      matrix:
        stage: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Build and measure Stage ${{ matrix.stage }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          command -v idf.py
          idf.py -B build-ci-stage${{ matrix.stage }} -D LIGHTGW_STAGE=${{ matrix.stage }} build
          idf.py -B build-ci-stage${{ matrix.stage }} size
          idf.py -B build-ci-stage${{ matrix.stage }} size-components

  c-tests-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C6 production C tests
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          command -v idf.py
          idf.py -B build-quality-c6 -DIDF_TARGET=esp32c6 build
        working-directory: tests/phase_a_app

  variants:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    strategy:
      fail-fast: false
      matrix:
        variant: [CORE, CORE_SENSOR, CORE_CLOUD, FULL]
    steps:
      - uses: actions/checkout@v4
      - name: Build and measure ${{ matrix.variant }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          command -v idf.py
          idf.py -B build-ci-variant-${{ matrix.variant }} -D LIGHTGW_VARIANT=${{ matrix.variant }} build
          idf.py -B build-ci-variant-${{ matrix.variant }} size
          idf.py -B build-ci-variant-${{ matrix.variant }} size-components

  c-tests-qemu:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Espressif RISC-V QEMU
        run: |
          python "$IDF_PATH/tools/idf_tools.py" install qemu-riscv32
          . "$IDF_PATH/export.sh"
          qemu-system-riscv32 --version
        shell: bash
      - name: Build QEMU test image
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-quality-qemu -DSDKCONFIG_DEFAULTS=sdkconfig.qemu -DIDF_TARGET=esp32c3 build
        working-directory: tests/phase_a_app
        shell: bash
      - name: Run production C tests
        run: |
          . "$IDF_PATH/export.sh"
          set +e
          timeout 45s idf.py -B build-quality-qemu qemu | tee qemu.log
          qemu_status=${PIPESTATUS[0]}
          set -e
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ]; then exit "$qemu_status"; fi
          grep -Eq "PHASE_A_C_TEST SUMMARY PASS: [0-9]+ tests" qemu.log
          if grep -q "PHASE_A_C_TEST FAIL" qemu.log; then exit 1; fi
        working-directory: tests/phase_a_app
        shell: bash
